<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המחשבון האישי שלי</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #667eea;
        }
        .calc-btn {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .calc-btn:hover {
            background-color: #5563c1;
        }
        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>המחשבון האישי</h2>
        
        <div class="input-group">
            <label for="num1">מספר ראשון:</label>
            <input type="number" id="num1" value="0">
        </div>

        <div class="input-group">
            <label for="operator">בחר פעולה:</label>
            <select id="operator">
                <option value="add">חיבור (+)</option>
                <option value="subtract">חיסור (-)</option>
                <option value="multiply">כפל (×)</option>
                <option value="divide">חילוק (÷)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="num2">מספר שני:</label>
            <input type="number" id="num2" value="0">
        </div>

        <button class="calc-btn" onclick="calculate()">חשב תוצאה</button>
        
        <div id="result">תוצאה: 0</div>
    </div>

    <script>
        function calculate() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const operator = document.getElementById('operator').value;
            let result;

            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById('result').innerText = 'נא להזין מספרים תקינים';
                return;
            }

            switch (operator) {
                case 'add':
                    result = n1 + n2;
                    break;
                case 'subtract':
                    result = n1 - n2;
                    break;
                case 'multiply':
                    result = n1 * n2;
                    break;
                case 'divide':
                    if (n2 === 0) {
                        document.getElementById('result').innerText = 'שגיאה: אי אפשר לחלק באפס';
                        return;
                    }
                    result = n1 / n2;
                    break;
            }

            document.getElementById('result').innerText = `תוצאה: ${result}`;
        }
    </script>

</body>
</html>
