<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון חיבור פשוט</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>מחשבון חיבור (עד 10)</h2>
    <div class="input-group">
        <label for="num1">מספר ראשון:</label>
        <input type="number" id="num1" min="1" max="10" value="1">
    </div>
    <div class="input-group">
        <label for="num2">מספר שני:</label>
        <input type="number" id="num2" min="1" max="10" value="1">
    </div>
    <button onclick="calculate()">חשב</button>
    <div id="result"></div>
</div>

<script>
    async function calculate() {
        const n1 = document.getElementById('num1').value;
        const n2 = document.getElementById('num2').value;

        const response = await fetch('/api/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ num1: Number(n1), num2: Number(n2) })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById('result').innerText = `תוצאה: ${data.sum}`;
        } else {
            document.getElementById('result').innerText = `שגיאה: ${data.error}`;
        }
    }
</script>

</body>
</html>
